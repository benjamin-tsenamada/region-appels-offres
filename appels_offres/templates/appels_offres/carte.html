{% extends "appels_offres/base.html" %}
{% block title %}Carte des districts - Région Atsimo-Andrefana{% endblock %}

{% block content %}

<div class="page-header">
    <div class="container">
        <h1>🗺️ Carte des districts de Madagascar</h1>
        <p class="sub">Visualisation géographique des appels d'offres publics</p>
    </div>
</div>

<div class="container-fluid px-3 mb-4">
    <div class="panel" style="overflow: hidden;">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <div id="map" style="height: 78vh; width: 100%;"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([-19.0, 46.5], 6);

    L.tileLayer('https://tile-a.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors, tiles HOT',
        maxZoom: 19,
    }).addTo(map);

    fetch("/api/carte-data/")
    .then(response => response.json())
    .then(data => {
        const tousLesMarqueurs = [];

        data.forEach(d => {
            const marker = L.marker([d.lat, d.lng]).addTo(map);

            let contenuPopup = `<div style="font-family: system-ui;">
                <strong style="font-size: 1.05rem; color: #0f172a;">${d.nom}</strong><br>
                <small style="color: #64748b;">${d.region || ''}</small><br>
                <span style="display:inline-block; margin-top:6px; padding: 3px 8px; background: #1e3a5f; color: #fff; border-radius: 4px; font-size: 0.75rem;">
                    ${d.nb_appels} AO
                </span><hr style="margin: 8px 0;">`;

            d.appels.forEach(a => {
                contenuPopup += `<div style="font-size: 0.78rem; padding: 6px 0; border-bottom: 1px solid #f1f5f9;">
                    <strong>${a.titre.substring(0, 70)}...</strong><br>
                    <span style="color: #64748b;">${a.autorite}</span><br>
                    ${a.mode ? '<span style="background:#0f172a; color:#fff; padding:1px 5px; border-radius:3px; font-size:0.7rem;">' + a.mode + '</span>' : ''}
                </div>`;
            });
            contenuPopup += '</div>';
            marker.bindPopup(contenuPopup, { maxWidth: 350 });

            tousLesMarqueurs.push(marker);
        });

        if (data.length > 0) {
            const groupe = L.featureGroup(tousLesMarqueurs);
            map.fitBounds(groupe.getBounds().pad(0.2));
        }
    })
    .catch(err => console.error("Erreur chargement carte :", err));
</script>

{% endblock %}
