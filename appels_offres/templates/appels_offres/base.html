{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Région Atsimo-Andrefana{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
            padding-top: 76px;
            min-height: 100vh;
        }

        /* ============ STICKY NAVBAR ============ */
        .navbar-sticky {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 0;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .navbar-sticky .container-fluid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .navbar-sticky .brand {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.3px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-sticky .brand:hover { color: #fff; }

        .navbar-sticky .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .navbar-sticky .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .navbar-sticky .nav-links a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .navbar-sticky .nav-links a.active {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        /* ============ FOND IMAGE TOLIARA ============ */
        .page-background {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: linear-gradient(rgba(241, 245, 249, 0.92), rgba(241, 245, 249, 0.95)),
                        url("{% static 'images/toliara.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ============ HERO ============ */
        .hero {
            position: relative;
            padding: 60px 0 70px 0;
            color: #fff;
            background: linear-gradient(120deg, rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85)),
                        url("{% static 'images/toliara.jpg' %}");
            background-size: cover;
            background-position: center 30%;
            margin-top: -76px;
            padding-top: 136px;
        }
        .hero::after {
            content: "";
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 80px;
            background: linear-gradient(to top, #f1f5f9, transparent);
            pointer-events: none;
        }
        .hero .brand {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.5);
        }
        .hero .subtitle {
            font-size: 1.05rem;
            color: #e2e8f0;
            margin: 0;
            font-weight: 400;
        }

        /* ============ EN-TÊTE DE PAGE ============ */
        .page-header {
            background: linear-gradient(120deg, rgba(30, 58, 95, 0.95), rgba(15, 23, 42, 0.95));
            color: #fff;
            padding: 30px 0;
            margin-bottom: 24px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .page-header h1 {
            margin: 0; font-size: 1.5rem; font-weight: 700;
        }
        .page-header .sub {
            font-size: 0.9rem; color: #cbd5e1; margin-top: 6px;
        }

        /* ============ CARTES STATS ============ */
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            height: 100%;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        }
        .stat-card::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 4px; height: 100%;
        }
        .stat-card.blue::before   { background: #1e3a5f; }
        .stat-card.orange::before { background: #ea580c; }
        .stat-card.green::before  { background: #16a34a; }
        .stat-card.purple::before { background: #7c3aed; }

        .stat-icon { font-size: 1.4rem; margin-bottom: 4px; display: inline-block; }
        .stat-label {
            font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 0.6px; color: #64748b;
            font-weight: 600; margin-bottom: 2px;
        }
        .stat-value {
            font-size: 1.9rem; font-weight: 800;
            color: #0f172a; margin: 0; line-height: 1.1;
        }
        .stat-value.blue   { color: #1e3a5f; }
        .stat-value.orange { color: #ea580c; }
        .stat-value.green  { color: #16a34a; }
        .stat-value.purple { color: #7c3aed; }
        .stat-sub { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

        /* ============ PANEL ============ */
        .panel {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
            overflow: hidden;
            height: 100%;
            backdrop-filter: blur(4px);
        }
        .panel-header {
            padding: 12px 18px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(248, 250, 252, 0.5);
        }
        .panel-header h5 {
            margin: 0; font-size: 0.95rem;
            font-weight: 700; color: #0f172a;
        }
        .panel-header .link {
            font-size: 0.78rem; color: #1e3a5f;
            text-decoration: none; font-weight: 500;
        }
        .panel-header .link:hover { text-decoration: underline; }
        .panel-body { padding: 14px 18px; }

        /* ============ TABLEAU COMPACT ============ */
        .table { margin: 0; font-size: 0.82rem; }
        .table thead th {
            color: #64748b; font-weight: 600;
            font-size: 0.68rem; text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 2px solid #e2e8f0;
            padding: 7px 6px; background: #f8fafc;
            white-space: nowrap;
        }
        .table tbody td {
            padding: 7px 6px;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover { background: #f8fafc; }

        /* ============ BADGES ============ */
        .badge-secteur {
            font-size: 0.68rem; font-weight: 500;
            padding: 2px 6px; border-radius: 4px;
        }
        .badge-region {
            font-size: 0.68rem; padding: 2px 6px;
            background: #e0e7ff; color: #3730a3;
            border-radius: 4px; font-weight: 500;
        }
        .badge-mode {
            font-size: 0.65rem; padding: 2px 6px;
            background: #0f172a; color: #fff;
            border-radius: 4px; font-weight: 600;
        }
        .ref-text {
            font-size: 0.7rem; color: #64748b;
            font-family: monospace;
        }
        .date-badge {
            font-size: 0.72rem; background: #fef3c7;
            color: #78350f; padding: 2px 6px;
            border-radius: 4px; font-weight: 500;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<!-- FOND IMAGE TOLIARA -->
<div class="page-background"></div>

<!-- BARRE STICKY -->
<div class="navbar-sticky">
    <div class="container-fluid px-4">
        <a href="{% url 'appels_offres:dashboard' %}" class="brand">
            🏛️ Région Atsimo-Andrefana
        </a>
        <div class="nav-links">
            <a href="{% url 'appels_offres:dashboard' %}"
               {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>
                Tableau de bord
            </a>
            <a href="{% url 'appels_offres:liste_appels' %}"
               {% if request.resolver_match.url_name == 'liste_appels' %}class="active"{% endif %}>
                Appels d'offres
            </a>
            <a href="{% url 'appels_offres:performance_ia' %}"
               {% if request.resolver_match.url_name == 'performance_ia' %}class="active"{% endif %}>
                Performance IA
            </a>
            <a href="{% url 'appels_offres:statistiques' %}"
               {% if request.resolver_match.url_name == 'statistiques' %}class="active"{% endif %}>
                Statistiques
            </a>
            <a href="{% url 'appels_offres:carte' %}"
               {% if request.resolver_match.url_name == 'carte' %}class="active"{% endif %}>
                Carte
            </a>
            <a href="{% url 'appels_offres:synchronisation' %}"
               {% if request.resolver_match.url_name == 'synchronisation' %}class="active"{% endif %}>
                🔄 Sync ARMP
            </a>
        </div>
    </div>
</div>

{% block content %}{% endblock %}

</body>
</html>
